<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Alvantix | AI & Software Innovation Company</title>

    <!-- ==================== -->
    <!-- FAVICON -->
    <!-- ==================== -->

    <!-- Modern browsers -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- PNG fallback -->
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/favicon-96x96.png"
    />

    <!-- Legacy browsers -->
    <link
      rel="icon"
      href="/favicon.ico"
    />

    <!-- Apple / iOS -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <!-- Android / PWA -->
    <link
      rel="manifest"
      href="/site.webmanifest"
    />

    <!-- Browser / App Theme -->
    <meta
      name="theme-color"
      content="#2563EB"
    />

    <meta
      name="application-name"
      content="Alvantix"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Alvantix"
    />

    <!-- ==================== -->
    <!-- SEO -->
    <!-- ==================== -->

    <meta
      name="description"
      content="Alvantix delivers AI-powered software, web development, automation, digital marketing, analytics, and intelligent digital solutions for modern businesses."
    />

    <meta
      name="keywords"
      content="Alvantix, AI, Artificial Intelligence, Software Development, Web Development, Mobile Apps, Automation, Digital Marketing, Data Analytics, UI UX Design, Technology"
    />

    <meta
      name="author"
      content="Alvantix"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- ==================== -->
    <!-- OPEN GRAPH -->
    <!-- ==================== -->

    <meta
      property="og:title"
      content="Alvantix | AI & Software Innovation Company"
    />

    <meta
      property="og:description"
      content="Building intelligent digital solutions through AI, software, automation, digital marketing, analytics, and technology."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Alvantix"
    />

    <meta
      property="og:url"
      content="https://alvantix.in"
    />

    <meta
      property="og:image"
      content="https://alvantix.in/og-image.png"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
