<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Official Brand Title & Meta Description -->
    <title>Alvantix | AI &amp; Software Innovation Company</title>
    <meta
      name="description"
      content="Alvantix is an AI-first technology and software innovation company developing intelligent applications, AI solutions, automation systems and digital technologies for modern businesses."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Alvantix" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="application-name" content="Alvantix" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.alvantix.in/" />

    <!-- Performance: Preconnect to Font Endpoints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Browser Favicons (Vector SVG First for High-DPI Clarity) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- WebSite & Organization Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.alvantix.in/#organization",
            "name": "Alvantix",
            "alternateName": "Alvantix AI",
            "url": "https://www.alvantix.in/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.alvantix.in/logo/alvantix%20logo.png",
              "caption": "Alvantix Circular AI Logo"
            },
            "description": "Alvantix is an AI-first technology and software innovation company developing intelligent applications, AI solutions, automation systems and digital technologies for modern businesses.",
            "email": "contact@alvantix.in",
            "telephone": "+91 77802 39013",
            "sameAs": [
              "https://linkedin.com/company/alvantix",
              "https://instagram.com/alvantix_ai",
              "https://youtube.com/@alvantix"
            ],
            "contactPoint": [
              {
                "@type": "ContactPoint",
                "telephone": "+91 77802 39013",
                "contactType": "technical support and inquiries",
                "email": "contact@alvantix.in",
                "availableLanguage": ["English", "Hindi", "Telugu"]
              }
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://www.alvantix.in/#website",
            "url": "https://www.alvantix.in/",
            "name": "Alvantix",
            "alternateName": "Alvantix AI",
            "description": "Building Intelligent Digital Solutions for the Future.",
            "publisher": {
              "@id": "https://www.alvantix.in/#organization"
            }
          }
        ]
      }
    </script>

    <!-- Open Graph Social Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alvantix" />
    <meta property="og:title" content="Alvantix | AI &amp; Software Innovation Company" />
    <meta
      property="og:description"
      content="Alvantix is an AI-first technology and software innovation company developing intelligent applications, AI solutions, automation systems and digital technologies for modern businesses."
    />
    <meta property="og:url" content="https://www.alvantix.in/" />
    <meta property="og:image" content="https://www.alvantix.in/og-image.png" />
    <meta property="og:image:alt" content="Alvantix — AI &amp; Software Innovation" />

    <!-- Twitter / X Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alvantix | AI &amp; Software Innovation Company" />
    <meta
      name="twitter:description"
      content="Alvantix is an AI-first technology and software innovation company developing intelligent applications, AI solutions, automation systems and digital technologies for modern businesses."
    />
    <meta name="twitter:image" content="https://www.alvantix.in/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
