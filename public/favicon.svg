<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="alvBlueGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0528e0" />
      <stop offset="50%" stop-color="#0214a8" />
      <stop offset="100%" stop-color="#010a61" />
    </linearGradient>
    <filter id="chipGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed Sapphire Blue Outer Circle: r=98 filling edge-to-edge for maximum tab visibility -->
  <circle cx="100" cy="100" r="98" fill="url(#alvBlueGrad)" stroke="#2563EB" stroke-width="2" />

  <!-- Upper Semi-Circle Network Nodes (Vibrant Light Cyan-Blue) -->
  <g stroke="#38bdf8" stroke-width="2.5" opacity="0.95">
    <line x1="32" y1="95" x2="48" y2="52" />
    <line x1="48" y1="52" x2="80" y2="30" />
    <line x1="80" y1="30" x2="120" y2="30" />
    <line x1="120" y1="30" x2="158" y2="52" />
    <line x1="158" y1="52" x2="172" y2="90" />
    <line x1="48" y1="52" x2="90" y2="62" />
    <line x1="80" y1="30" x2="90" y2="62" />
    <line x1="120" y1="30" x2="142" y2="68" />
    <line x1="142" y1="68" x2="172" y2="90" />
  </g>
  <circle cx="32" cy="95" r="5.5" fill="#38bdf8" />
  <circle cx="48" cy="52" r="6" fill="#60a5fa" />
  <circle cx="80" cy="30" r="7" fill="#38bdf8" />
  <circle cx="120" cy="30" r="6" fill="#60a5fa" />
  <circle cx="158" cy="52" r="7" fill="#38bdf8" />
  <circle cx="172" cy="90" r="5.5" fill="#60a5fa" />
  <circle cx="90" cy="62" r="5" fill="#bae6fd" />
  <circle cx="142" cy="68" r="4.5" fill="#bae6fd" />

  <!-- Lower Semi-Circle Network Nodes (Crisp Opaque White) -->
  <g stroke="#ffffff" stroke-width="2.5" opacity="1">
    <line x1="35" y1="120" x2="58" y2="154" />
    <line x1="58" y1="154" x2="90" y2="175" />
    <line x1="90" y1="175" x2="116" y2="142" />
    <line x1="116" y1="142" x2="148" y2="168" />
    <line x1="148" y1="168" x2="170" y2="135" />
    <line x1="35" y1="120" x2="90" y2="132" stroke-opacity="0.6" />
    <line x1="90" y1="132" x2="90" y2="175" stroke-opacity="0.6" />
  </g>
  <circle cx="35" cy="120" r="6" fill="#ffffff" />
  <circle cx="58" cy="154" r="10.5" fill="#ffffff" />
  <circle cx="90" cy="175" r="6" fill="#ffffff" />
  <circle cx="116" cy="142" r="7" fill="#ffffff" />
  <circle cx="148" cy="168" r="9.5" fill="#ffffff" />
  <circle cx="170" cy="135" r="6.5" fill="#ffffff" />
  <circle cx="90" cy="132" r="4.5" fill="#e2e8f0" />

  <!-- Central Microchip Pins -->
  <line x1="92" y1="70" x2="92" y2="82" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
  <line x1="100" y1="70" x2="100" y2="82" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
  <line x1="108" y1="70" x2="108" y2="82" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />

  <line x1="92" y1="118" x2="92" y2="130" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
  <line x1="100" y1="118" x2="100" y2="130" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
  <line x1="108" y1="118" x2="108" y2="130" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />

  <line x1="70" y1="92" x2="82" y2="92" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
  <line x1="70" y1="100" x2="82" y2="100" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
  <line x1="70" y1="108" x2="82" y2="108" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />

  <line x1="118" y1="92" x2="130" y2="92" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
  <line x1="118" y1="100" x2="130" y2="100" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
  <line x1="118" y1="108" x2="130" y2="108" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />

  <!-- Microprocessor Body -->
  <rect x="80" y="80" width="40" height="40" rx="7" fill="#041a99" stroke="#60a5fa" stroke-width="3.5" filter="url(#chipGlow)" />

  <!-- Stylized Electronic AI Signature inside chip -->
  <path d="M92 111 L98 92 L104 111" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="94" y1="104" x2="102" y2="104" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <line x1="109" y1="92" x2="113" y2="92" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="109" y1="99" x2="113" y2="99" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="107" y1="106" x2="113" y2="106" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
</svg>
